name: Inspect Stage 2 Source
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect handler declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('src/App07.jsx').read_text(encoding='utf-8')
          names=['beginTurn','drawPrayer','drawChar','drawSupport','deploy','switchTo','useSupport','attack','endTurn']
          for name in names:
              for m in re.finditer(r'\b(?:const|function) '+re.escape(name)+r'\b', text):
                  print(f'=== {name} @ {m.start()} ===')
                  print(text[max(0,m.start()-100):m.start()+800])
                  break
              else:
                  print(f'=== {name}: NOT FOUND ===')
          PY
