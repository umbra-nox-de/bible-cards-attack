name: Apply Bench Anytime Rule
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'umbra-nox-de'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bench deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App07.jsx')
          s=p.read_text()
          old='deploy=n=>{if(winner)return;if(phase===\'setup\')return selectInitialActive(n);if(phase!==\'prepare\'||currentPlayer!==\'player\')return;if(!active){setActive(n);setHand(h=>h.filter(x=>x!==n));setLog(l=>[lines[n],...l]);if(n===\'Michael\')setShield(10);return}if(bench.length>=3)return addLog(\'🪑 Bench is full (3/3).\');setBench(b=>[...b,n]);setHand(h=>h.filter(x=>x!==n));addLog(`${C[n].name} deployed to the Bench.`)};'
          new='deploy=n=>{if(winner||currentPlayer!==\'player\'||phase===\'setup\')return;if(![\'draw\',\'prepare\',\'attack\'].includes(phase))return;if(!active)return addLog(\'⚔️ Choose an Active Character first.\');if(!hand.includes(n)||bench.includes(n)||active===n)return;if(bench.length>=3)return addLog(\'🪑 Bench is full (3/3).\');setBench(b=>[...b,n]);setHand(h=>h.filter(x=>x!==n));addLog(`🪑 ${C[n].name} deployed to the Bench.`)};'
          if old not in s: raise SystemExit('deploy block not found')
          s=s.replace(old,new,1)
          old=' <Card id={n} onClick={()=>selectInitialActive(n)}/>'
          new=' <Card id={n} onClick={()=>phase===\'setup\'&&!active?selectInitialActive(n):deploy(n)}/>'
          if old not in s: raise SystemExit('hand card block not found')
          s=s.replace(old,new,1)
          old='<h3>🎴 Character Hand {hand.length}/3</h3>'
          new='<h3>🎴 Character Hand {hand.length}/3 <small>— tap a card to Bench during your turn</small></h3>'
          if old not in s: raise SystemExit('hand heading not found')
          s=s.replace(old,new,1)
          old='<li>Bench deployment is free and does not end the turn.</li>'
          new='<li>Bench deployment is free and may be done at any point during your turn, including Upkeep. It does not count as an attack or end the turn.</li>'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Remove patch workflow
        run: rm .github/workflows/bench-anytime.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App07.jsx .github/workflows/bench-anytime.yml
          git commit -m 'fix: allow bench deployment anytime during turn'
          git push