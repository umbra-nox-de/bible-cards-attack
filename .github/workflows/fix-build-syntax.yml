name: Fix Build Syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix malformed Mark apostrophe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App07.jsx')
          s=p.read_text()
          old="addLog('⚡ Immediately!: Mark's first attack costs 1 less Prayer.')"
          new="addLog('⚡ Immediately!: Mark\\'s first attack costs 1 less Prayer.')"
          if old not in s:
              raise SystemExit('Malformed Mark string not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App07.jsx
          git rm .github/workflows/fix-build-syntax.yml
          git commit -m "Fix malformed Mark passive log string"
          git push
