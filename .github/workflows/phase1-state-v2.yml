name: Phase 1 Battle State Consolidation v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Consolidate battle state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App07.jsx')
          text = path.read_text(encoding='utf-8')

          if 'from "./useBattleState"' not in text:
              text = text.replace(
                  'import {BATTLE_PHASES,',
                  'import {useBattleState} from "./useBattleState";\nimport {BATTLE_PHASES,',
                  1,
              )

          old = """ const [active,setActive]=useState(null),[bench,setBench]=useState([]),[hand,setHand]=useState([]),[deck,setDeck]=useState([]),[supportHand,setSupportHand]=useState([]),[supportDeck,setSupportDeck]=useState([]),[discard,setDiscard]=useState([]);\n const [hp,setHp]=useState({}),[enemyHp,setEnemyHp]=useState(0),[prayers,setPrayers]=useState(0),[prayerDeck,setPrayerDeck]=useState([]),[prayerDiscard,setPrayerDiscard]=useState([]);\n const [phase,setPhase]=useState(BATTLE_PHASES.SETUP),[turnNo,setTurnNo]=useState(0),[firstPlayer,setFirstPlayer]=useState('player'),[currentPlayer,setCurrentPlayer]=useState('player');\n const [characterDraws,setCharacterDraws]=useState(0),[supportDraws,setSupportDraws]=useState(0),[prayerDrawn,setPrayerDrawn]=useState(false),[attacked,setAttacked]=useState(false),[switchCooldown,setSwitchCooldown]=useState(0),[shield,setShield]=useState(0),[nextAttackBonus,setNextAttackBonus]=useState(0);\n const [status,setStatus]=useState({burn:0,plague:0,stun:0,stunTurns:0}),[enemyStatus,setEnemyStatus]=useState({burn:0,plague:0,weaken:0}),[used,setUsed]=useState({jonah:false,gideon:false,esther:false,paul:false,peter:false,samson:false,ga:false,philip:false,mark:false,samuel:false,thomas:false,gabriel:false});\n const [winner,setWinner]=useState(null),[log,setLog]=useState([]),[detail,setDetail]=useState(null),[code,setCode]=useState(''),[codeMsg,setCodeMsg]=useState('');"""

          new = """ const {state:battleState,active,setActive,bench,setBench,hand,setHand,deck,setDeck,supportHand,setSupportHand,supportDeck,setSupportDeck,discard,setDiscard,hp,setHp,enemyHp,setEnemyHp,prayers,setPrayers,prayerDeck,setPrayerDeck,prayerDiscard,setPrayerDiscard,phase,setPhase,turnNo,setTurnNo,firstPlayer,setFirstPlayer,currentPlayer,setCurrentPlayer,characterDraws,setCharacterDraws,supportDraws,setSupportDraws,prayerDrawn,setPrayerDrawn,attacked,setAttacked,switchCooldown,setSwitchCooldown,shield,setShield,nextAttackBonus,setNextAttackBonus,status,setStatus,enemyStatus,setEnemyStatus,used,setUsed,winner,setWinner,log,setLog}=useBattleState();\n const [detail,setDetail]=useState(null),[code,setCode]=useState(''),[codeMsg,setCodeMsg]=useState('');"""

          if old not in text:
              raise SystemExit('Expected battle state declaration block was not found; refusing to modify App07.jsx.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source
        run: |
          grep -q 'state:battleState' src/App07.jsx
          grep -q 'from "./useBattleState"' src/App07.jsx

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit consolidation and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App07.jsx
          git rm -f .github/workflows/phase1-state-v2.yml
          git commit -m "refactor: consolidate battle state"
          git push
