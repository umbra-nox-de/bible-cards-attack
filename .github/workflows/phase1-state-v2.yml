name: Phase 1 Battle State Consolidation v2

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Consolidate battle state
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('src/App07.jsx')
          text=path.read_text(encoding='utf-8')

          if 'from "./useBattleState"' not in text:
              text=text.replace(
                  'import {BATTLE_PHASES,',
                  'import {useBattleState} from "./useBattleState";\nimport {BATTLE_PHASES,',
                  1,
              )

          if 'const {state:battleState' not in text:
              start=text.index(' const [active,setActive')
              end=text.index('\n const addLog',start)
              replacement=''' const {state:battleState,active,setActive,bench,setBench,hand,setHand,deck,setDeck,supportHand,setSupportHand,supportDeck,setSupportDeck,discard,setDiscard,hp,setHp,enemyHp,setEnemyHp,prayers,setPrayers,prayerDeck,setPrayerDeck,prayerDiscard,setPrayerDiscard,phase,setPhase,turnNo,setTurnNo,firstPlayer,setFirstPlayer,currentPlayer,setCurrentPlayer,characterDraws,setCharacterDraws,supportDraws,setSupportDraws,prayerDrawn,setPrayerDrawn,attacked,setAttacked,switchCooldown,setSwitchCooldown,shield,setShield,nextAttackBonus,setNextAttackBonus,status,setStatus,enemyStatus,setEnemyStatus,used,setUsed,winner,setWinner,log,setLog}=useBattleState();
 const [detail,setDetail]=useState(null),[code,setCode]=useState(''),[codeMsg,setCodeMsg]=useState('');'''
              text=text[:start]+replacement+text[end:]

          path.write_text(text,encoding='utf-8')
          PY

      - name: Verify
        run: |
          grep -q 'state:battleState' src/App07.jsx
          grep -q 'from "./useBattleState"' src/App07.jsx

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App07.jsx src/useBattleState.js
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "refactor: consolidate battle state"
            git push
          fi

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/phase1-state-v2.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary state workflow"
          git push
