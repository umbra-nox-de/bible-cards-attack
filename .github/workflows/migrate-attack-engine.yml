name: Migrate Attack To Pure Engine

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply attack engine migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App07.jsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'import {C,starter,mythic,supports,opponents,lines,attackFlavor} from "./cardData.js";'
          engine_import = 'import {resolveAttack} from "./battleEngine.js";'
          if engine_import not in text:
              if import_anchor not in text:
                  raise SystemExit('cardData import anchor not found')
              text = text.replace(import_anchor, import_anchor + '\n' + engine_import, 1)

          start_marker = ' const attack=(index)=>{'
          end_marker = "\n useEffect(()=>{if(enemyHp<=0&&page==='battle'&&!winner"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('attack handler start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('attack handler end not found')

          new_attack = ''' const attack=(index)=>{\n  if(!canAttackDuringAction({phase,currentPlayer,active,attacksUsed:attacked?1:0,forcedReplacementPending:false}))return;\n  if(status.stun>0)return addLog('⚡ Stunned — you cannot attack this turn.');\n  const a=C[active]?.attacks?.[index];\n  if(!a)return;\n  const result=resolveAttack({active,character:C[active],attack:a,index,hp,nextAttackBonus,used});\n  if(!result.ok)return addLog(`⚔️ ${result.reason}`);\n  if(prayers<result.cost)return addLog(`🙏 Not enough Prayer. Need ${result.cost}, have ${prayers}.`);\n  dispatchBattle({type:"RECORD_ATTACK"});\n  setPrayers(p=>p-result.cost);\n  setNextAttackBonus(result.nextAttackBonus);\n  setUsed(result.used);\n  setEnemyHp(v=>Math.max(0,v-result.damage));\n  if(active==='Matthew'&&Math.random()<0.25){setPrayers(p=>Math.min(10,p+1));addLog('🪙 Tax Collector: Matthew collected 1 Prayer.')}\n  addLog(attackFlavor[result.name]||`${C[active].name} attacks!`);\n  addLog(`${C[active].name} used ${result.name} for ${result.damage}${result.crit?' 💥 CRITICAL HIT':''} damage.`);\n  if(active==='Moses')setEnemyStatus(e=>({...e,plague:2}));\n  if(active==='Elijah')setEnemyStatus(e=>({...e,burn:3}));\n };'''

          text = text[:start] + new_attack + text[end:]
          path.write_text(text, encoding='utf-8')
          print('Attack handler migrated.')
          PY

      - name: Install dependencies
        run: npm install

      - name: Battle action tests
        run: npm run test:battle

      - name: Battle engine tests
        run: npm run test:engine

      - name: Production build
        run: npm run build

      - name: Commit verified migration
        run: |
          if git diff --quiet; then
            echo 'No migration changes detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App07.jsx
          git commit -m 'refactor: route attack resolution through battle engine'
          git push
