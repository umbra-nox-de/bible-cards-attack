name: Fix Bench Click
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bench interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App07.jsx')
          s=p.read_text()
          old="const deploy=n=>{if(winner||currentPlayer!=='player'||phase==='setup')return;if(!['draw','prepare','attack'].includes(phase))return;if(!active)return addLog('⚔️ Choose an Active Character first.');if(!hand.includes(n)||bench.includes(n)||active===n)return;if(bench.length>=3)return addLog('🪑 Bench is full (3/3).');setBench(b=>[...b,n]);setHand(h=>h.filter(x=>x!==n));addLog(`🪑 ${C[n].name} deployed to the Bench.`)};"
          new="const deploy=n=>{if(winner||currentPlayer!=='player'||phase==='setup'||phase==='ending'||phase==='ai')return;if(!active)return addLog('⚔️ Choose an Active Character first.');if(!hand.includes(n)||bench.includes(n)||active===n)return;if(bench.length>=3)return addLog('🪑 Bench is full (3/3).');setBench(b=>[...b,n]);setHand(h=>h.filter(x=>x!==n));addLog(`🪑 ${C[n].name} deployed to the Bench.`)};"
          if old not in s and new not in s: raise SystemExit('deploy block not found')
          if old in s: s=s.replace(old,new,1)
          old="<Card id={n} onClick={()=>phase==='setup'&&!active?selectInitialActive(n):deploy(n)}/>"
          new="<Card id={n} onClick={()=>phase==='setup'&&!active?selectInitialActive(n):deploy(n)}/>"
          if old not in s: raise SystemExit('hand card block not found')
          insert="{phase!=='setup'&&<button type=\"button\" className=\"benchButton\" onClick={e=>{e.stopPropagation();deploy(n)}} disabled={winner||currentPlayer!=='player'||phase==='ending'||phase==='ai'||bench.length>=3}>🪑 Add to Bench</button>}"
          marker="<Card id={n} onClick={()=>phase==='setup'&&!active?selectInitialActive(n):deploy(n)}/>"
          s=s.replace(marker,marker+insert,1)
          p.write_text(s)
          PY
      - name: Add bench button styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/update07.css')
          s=p.read_text()
          rule='.benchButton{margin-top:4px;width:100%;background:#365b46;border-color:#79a86d;font-weight:bold}.benchButton:hover{background:#426d53}'
          if '.benchButton{' not in s: p.write_text(s+'\n'+rule+'\n')
          PY
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Remove patch workflow
        run: rm -f .github/workflows/fix-bench-click.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App07.jsx src/update07.css .github/workflows/fix-bench-click.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: make bench deployment explicit and unrestricted"
          git push
