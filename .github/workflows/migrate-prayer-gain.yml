name: Migrate Prayer Gain
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralize Prayer gain
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App07.jsx')
          s=p.read_text()
          if 'const gainPrayer=' not in s:
              needle=' const addLog=m=>setLog(x=>[m,...x].slice(0,18));\n'
              helper=' const gainPrayer=(amount)=>setPrayers(p=>applyPrayerGain(p,amount));\n'
              s=s.replace(needle,needle+helper,1)
          s=s.replace('setPrayers(p=>Math.min(10,p+1))','gainPrayer(1)')
          s=s.replace('setPrayers(p=>Math.min(10,p+2))','gainPrayer(2)')
          s=s.replace('setPrayers(p=>Math.min(10,p+3))','gainPrayer(3)')
          s=s.replace('setPrayers(p=>Math.min(10,p+result.prayerGain))','gainPrayer(result.prayerGain)')
          p.write_text(s)
          PY
          npm install
          npm run test:battle
          npm run test:engine
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App07.jsx .github/workflows/migrate-prayer-gain.yml
          git commit -m "Centralize Prayer gain handling"
          git push
          git rm .github/workflows/migrate-prayer-gain.yml
          git commit -m "chore: remove temporary prayer gain migration workflow"
          git push
