name: Phase 1 Battle Rules Refactor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refactor battle rules and guards
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/battleRules.js')
          s=p.read_text()
          if 'export function isPlayerTurn(state)' not in s:
              s += '''\n\nexport function isPlayerTurn(state) {\n  return state?.currentPlayer === "player";\n}\n\nexport function isUpkeep(state) {\n  return state?.phase === "draw";\n}\n\nexport function isActionPhase(state) {\n  return state?.phase === "prepare" || state?.phase === "attack";\n}\n\nexport function canDeployDuringTurn(state, character) {\n  return isPlayerTurn(state) && !state?.winner && state?.phase !== "setup" &&\n    (isUpkeep(state) || isActionPhase(state)) && canDeployToBench(state, character);\n}\n\nexport function canDrawCharacterDuringUpkeep(state) {\n  return isPlayerTurn(state) && isUpkeep(state) && canDrawCharacter(state);\n}\n\nexport function canDrawSupportDuringUpkeep(state) {\n  return isPlayerTurn(state) && isUpkeep(state) && canDrawSupport(state);\n}\n\nexport function canAttackDuringAction(state) {\n  return isPlayerTurn(state) && isActionPhase(state) && canAttack(state);\n}\n'''
              p.write_text(s)
          p=Path('src/App07.jsx')
          s=p.read_text()
          if 'from "./battleRules"' not in s:
              s=s.replace('import React,{useEffect,useMemo,useState} from "react";','import React,{useEffect,useMemo,useState} from "react";\nimport {canDeployDuringTurn,canDrawCharacterDuringUpkeep,canDrawSupportDuringUpkeep,canAttackDuringAction} from "./battleRules";')
          replacements=[
            ("const drawChar=()=>{if(phase!=='prepare'||currentPlayer!=='player'||winner)return;", "const drawChar=()=>{if(!canDrawCharacterDuringUpkeep({phase,currentPlayer,hand,characterDraws}))return;"),
            ("const drawSupport=()=>{if(phase!=='prepare'||currentPlayer!=='player'||winner)return;", "const drawSupport=()=>{if(!canDrawSupportDuringUpkeep({phase,currentPlayer,supportHand,supportDraws}))return;"),
            ("const attack=(index)=>{if(phase!=='prepare'||currentPlayer!=='player'||attacked||winner||!active)return;", "const attack=(index)=>{if(!canAttackDuringAction({phase,currentPlayer,active,attacksUsed:attacked?1:0,forcedReplacementPending:false}))return;"),
            ("const deploy=n=>{if(winner)return;if(phase==='setup')return selectInitialActive(n);if(phase!=='prepare'||currentPlayer!=='player')return;", "const deploy=n=>{if(winner||currentPlayer!=='player'||phase==='setup')return;if(!canDeployDuringTurn({phase,currentPlayer,winner,hand,bench},n))return;")
          ]
          for old,new in replacements:
              if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/refactor-phase1.yml').unlink()
      - name: Build
        run: npm install && npm run build
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/battleRules.js src/App07.jsx .github/workflows/refactor-phase1.yml
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: centralize phase 1 battle action guards'
          git push
