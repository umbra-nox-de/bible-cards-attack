name: Migrate Battle UI To Dispatcher

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Migrate battle handlers
        run: python scripts/migrateBattleDispatcher.py
      - name: Install dependencies
        run: npm install
      - name: Battle tests
        run: npm run test:battle
      - name: Production build
        run: npm run build
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App07.jsx
          if git diff --cached --quiet; then
            echo "No App07 migration changes were produced."
            exit 0
          fi
          git commit -m "refactor: route safe battle UI actions through dispatcher"
          git push
          echo "App07 migration committed."
      - name: Remove one-time migration workflow
        if: success()
        run: |
          git rm .github/workflows/migrate-battle-dispatch.yml scripts/migrateBattleDispatcher.py
          git commit -m "chore: remove one-time dispatcher migration tools"
          git push
