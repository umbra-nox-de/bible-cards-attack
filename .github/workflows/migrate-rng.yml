name: Migrate RNG To Central Interface

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'Add RNG migration helper') || contains(github.event.head_commit.message, 'RNG migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor random usage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App07.jsx')
          s=p.read_text()
          marker='import {resolveAttack,resolveEnemyDamage,resolveSupport,applyIncomingDamage,statusTickDamage,advanceStatus,applyPrayerGain} from "./battleEngine.js";\n'
          if 'import {battleRng} from "./rng.js";' not in s:
              if marker not in s:
                  raise SystemExit('Battle engine import marker not found')
              s=s.replace(marker, marker+'import {battleRng} from "./rng.js";\n',1)
          s=s.replace('function shuffle(a){return [...a].sort(()=>Math.random()-.5)}','function shuffle(a){return battleRng.shuffle(a)}')
          s=s.replace("const opener=Math.random()<.5?'player':'enemy';","const opener=battleRng.chance(.5)?'player':'enemy';")
          s=s.replace('const result=resolveAttack({active,character:C[active],attack:a,index,hp,nextAttackBonus,used});','const result=resolveAttack({active,character:C[active],attack:a,index,hp,nextAttackBonus,used,random:battleRng.next});')
          s=s.replace('const result=resolveEnemyDamage({opponent:currentOpp,enemyHp,enemyStatus});','const result=resolveEnemyDamage({opponent:currentOpp,enemyHp,enemyStatus,random:battleRng.next});')
          s=s.replace("Math.random().toString(36).slice(2,8).toUpperCase()", "Array.from({length:6},()=>\"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789\"[battleRng.int(36)]).join(\"\")")
          for old,new in {
              'Math.random()<0.25':'battleRng.chance(0.25)','Math.random()<.25':'battleRng.chance(.25)',
              'Math.random() < 0.25':'battleRng.chance(0.25)','Math.random() < .25':'battleRng.chance(.25)',
              'Math.random()<0.5':'battleRng.chance(0.5)','Math.random()<.5':'battleRng.chance(.5)',
              'Math.random() < 0.5':'battleRng.chance(0.5)','Math.random() < .5':'battleRng.chance(.5)',
              'Math.random()<0.3':'battleRng.chance(0.3)','Math.random()<.3':'battleRng.chance(.3)',
              'Math.random() < 0.3':'battleRng.chance(0.3)','Math.random() < .3':'battleRng.chance(.3)'
          }.items():
              s=s.replace(old,new)
          leftovers=[(i+1,line) for i,line in enumerate(s.splitlines()) if 'Math.random' in line]
          if leftovers: raise SystemExit('Unmigrated Math.random usage: '+repr(leftovers))
          p.write_text(s)
          PY
      - name: Add RNG validation script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('package.json'); data=json.loads(p.read_text()); data['scripts']['test:rng']='node scripts/verifyRng.mjs'; p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Validate migration
        run: |
          npm install
          npm run test:battle
          npm run test:engine
          npm run test:rng
          npm run build
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App07.jsx scripts/verifyRng.mjs src/rng.js package.json
          git commit -m "Centralize battle RNG usage"
          git push
