name: Migrate RNG To Central Interface

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'Add RNG migration helper')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor random usage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App07.jsx')
          s=p.read_text()
          if 'from "./rng.js"' not in s:
              s=s.replace('import {resolveAttack,resolveEnemyDamage,resolveSupport,applyIncomingDamage,statusTickDamage,advanceStatus,applyPrayerGain} from "./battleEngine.js";\n', 'import {resolveAttack,resolveEnemyDamage,resolveSupport,applyIncomingDamage,statusTickDamage,advanceStatus,applyPrayerGain} from "./battleEngine.js";\nimport {battleRng} from "./rng.js";\n')
          s=s.replace('function shuffle(a){return [...a].sort(()=>Math.random()-.5)}', 'function shuffle(a){return battleRng.shuffle(a)}')
          s=s.replace("const opener=Math.random()<.5?'player':'enemy';", "const opener=battleRng.chance(.5)?'player':'enemy';")
          s=s.replace('random:Math.random', 'random:battleRng.next')
          s=s.replace('random: Math.random', 'random: battleRng.next')
          s=s.replace("Math.random()<0.25", "battleRng.chance(0.25)")
          s=s.replace("Math.random()<.25", "battleRng.chance(.25)")
          s=s.replace("Math.random()<0.5", "battleRng.chance(0.5)")
          s=s.replace("Math.random()<.5", "battleRng.chance(.5)")
          s=s.replace("Math.random()<0.3", "battleRng.chance(0.3)")
          s=s.replace("Math.random()<.3", "battleRng.chance(.3)")
          p.write_text(s)

          leftovers=[(i+1,line) for i,line in enumerate(s.splitlines()) if 'Math.random' in line]
          if leftovers:
              raise SystemExit(f'Unmigrated Math.random usage: {leftovers}')
          PY
      - name: Add RNG test script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('package.json')
          data=json.loads(p.read_text())
          data['scripts']['test:rng']='node scripts/verifyRng.mjs'
          p.write_text(json.dumps(data,indent=2)+'\n')
          w=Path('.github/workflows/refactor-validation.yml')
          ws=w.read_text()
          if 'Battle RNG tests' not in ws:
              ws=ws.replace('      - name: Battle engine tests\n        run: npm run test:engine\n', '      - name: Battle engine tests\n        run: npm run test:engine\n      - name: Battle RNG tests\n        run: npm run test:rng\n')
              w.write_text(ws)
          PY
      - name: Validate
        run: |
          npm install
          npm run test:battle
          npm run test:engine
          npm run test:rng
          npm run build
      - name: Commit migration and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App07.jsx src/rng.js scripts/verifyRng.mjs package.json .github/workflows/refactor-validation.yml
          git rm .github/workflows/migrate-rng.yml
          git commit -m "Centralize battle RNG usage"
          git push
