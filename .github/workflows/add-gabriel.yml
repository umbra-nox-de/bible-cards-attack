name: Add Michael Promotion and Gabriel
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch card roster
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App07.jsx')
          s=p.read_text()

          # Promote Michael to Legendary.
          s2,n=re.subn(r'(Michael:\{[^\n]*?rarity:)"Epic"', r'\1"Legendary"', s, count=1)
          if n != 1:
              raise SystemExit('Michael rarity target not found')
          s=s2

          # Add Gabriel once, immediately after Michael.
          if 'Gabriel:{name:"Gabriel"' not in s:
              marker='Michael:{name:"Michael",title:"The Archangel",hp:135,icon:"⚔️",rarity:"Legendary",passive:"Guardian\\\'s Wing — gains 10 Protection on entry.",attacks:[[\'Heavenly Strike\',2,40],[\'Archangel\\\'s Judgment\',4,62]]},'
              if marker not in s:
                  raise SystemExit('Michael insertion marker not found')
              gab='Gabriel:{name:"Gabriel",title:"The Divine Messenger",hp:130,icon:"📯",rarity:"Legendary",passive:"Divine Message — the first time each turn you draw a Support during Upkeep, gain 1 Prayer.",attacks:[[\'Trumpet of Heaven\',2,38],[\'Messenger\\\'s Judgment\',4,60]]},'
              s=s.replace(marker,marker+'\n '+gab,1)

          # Put Gabriel in the normal character roster.
          if "'Gabriel'" not in s:
              s=s.replace("'Moses','Michael','Elijah'", "'Moses','Michael','Gabriel','Elijah'", 1)

          # Add Gabriel's flavor text if absent.
          if "Gabriel:'" not in s:
              s=s.replace("Michael:'⚔️ Michael descends from Heaven to the battlefield.',", "Michael:'⚔️ Michael descends from Heaven to the battlefield.',Gabriel:'📯 Gabriel arrives with a message from Heaven.',", 1)

          # Add Gabriel's attack flavor text if absent.
          if "'Trumpet of Heaven':" not in s:
              s=s.replace("'Heavenly Strike':'⚔️ Michael raises his heavenly sword.',", "'Heavenly Strike':'⚔️ Michael raises his heavenly sword.','Trumpet of Heaven':'📯 Gabriel sounds the trumpet of Heaven.','Messenger\\'s Judgment':'📯 Gabriel delivers the message with authority.',", 1)

          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App07.jsx
          git rm .github/workflows/add-gabriel.yml
          git commit -m "Promote Michael and add Gabriel"
          git push
