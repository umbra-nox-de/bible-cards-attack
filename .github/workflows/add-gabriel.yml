name: Add Michael Promotion and Gabriel
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch card roster
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App07.jsx')
          s=p.read_text()

          # Promote Michael to Legendary without depending on apostrophe escaping.
          s2,n=re.subn(r'(Michael:\{[^\n]*?rarity:)"Epic"', r'\1"Legendary"', s, count=1)
          if n == 1:
              s=s2
          elif 'Michael:{name:"Michael"' not in s or 'rarity:"Legendary"' not in s[s.index('Michael:{name:"Michael"'):s.index('Michael:{name:"Michael"')+500]:
              raise SystemExit('Michael card target not found')

          # Add Gabriel once, directly after Michael.
          if 'Gabriel:{name:"Gabriel"' not in s:
              m=re.search(r'Michael:\{[^\n]*?\},\n', s)
              if not m:
                  raise SystemExit('Michael insertion point not found')
              gab=' Gabriel:{name:"Gabriel",title:"The Divine Messenger",hp:130,icon:"📯",rarity:"Legendary",passive:"Divine Message — the first time each turn you draw a Support during Upkeep, gain 1 Prayer.",attacks:[[\'Trumpet of Heaven\',2,38],[\'Messenger\\\'s Judgment\',4,60]]},\n'
              s=s[:m.end()]+gab+s[m.end():]

          # Put Gabriel in the normal character roster.
          if "'Gabriel'" not in s:
              if "'Moses','Michael','Elijah'" in s:
                  s=s.replace("'Moses','Michael','Elijah'", "'Moses','Michael','Gabriel','Elijah'", 1)
              else:
                  raise SystemExit('Starter roster insertion point not found')

          # Flavor text.
          if "Gabriel:'" not in s:
              if "Michael:'" in s:
                  s=s.replace("Michael:'⚔️ Michael descends from Heaven to the battlefield.',", "Michael:'⚔️ Michael descends from Heaven to the battlefield.',Gabriel:'📯 Gabriel arrives with a message from Heaven.',", 1)
              else:
                  raise SystemExit('Battle flavor insertion point not found')

          if "'Trumpet of Heaven':" not in s:
              if "'Heavenly Strike':" in s:
                  s=s.replace("'Heavenly Strike':'⚔️ Michael raises his heavenly sword.',", "'Heavenly Strike':'⚔️ Michael raises his heavenly sword.','Trumpet of Heaven':'📯 Gabriel sounds the trumpet of Heaven.','Messenger\\'s Judgment':'📯 Gabriel delivers the message with authority.',", 1)
              else:
                  raise SystemExit('Attack flavor insertion point not found')

          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App07.jsx
          git rm .github/workflows/add-gabriel.yml
          git commit -m "Promote Michael and add Gabriel"
          git push
