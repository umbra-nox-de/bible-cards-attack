name: Refactor Validation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Battle action tests
        run: npm run test:battle
      - name: Battle engine tests
        run: npm run test:engine
      - name: Battle RNG tests
        run: npm run test:rng
      - name: Support effect tests
        run: npm run test:support
      - name: Character effect tests
        run: npm run test:character
      - name: Build
        run: npm run build
