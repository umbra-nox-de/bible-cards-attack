name: Inspect Attack Handler
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect attack and support handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('src/App07.jsx').read_text(encoding='utf-8')
          for needle in ['const attack=','const useSupport=','const endTurn=']:
              i=text.find(needle)
              print('===', needle, 'index=', i, '===')
              if i>=0:
                  print(text[i:i+5000])
          PY
