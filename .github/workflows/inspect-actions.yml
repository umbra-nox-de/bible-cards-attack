name: Inspect Battle Actions

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect battle handlers
        run: |
          python - <<'PY'
          text=open('src/App07.jsx',encoding='utf-8').read().splitlines()
          print('\n'.join(f'{i+1}: {line}' for i,line in enumerate(text[52:73],52)))
          PY
