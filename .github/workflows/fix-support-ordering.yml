name: Fix Support Ordering

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/App07.jsx")
          text = path.read_text(encoding="utf-8")
          old = ''' const useSupport=s=>{if(!canAttackDuringAction({phase,currentPlayer,active,attacksUsed:0,forcedReplacementPending:false}))return;if(!supportHand.some(x=>x===s||x?.id===s.id))return;dispatchBattle({type:"USE_SUPPORT",support:s.id});const result=resolveSupport({supportId:s.id,active,used});if(!result.ok)return;'''
          new = ''' const useSupport=s=>{if(!canAttackDuringAction({phase,currentPlayer,active,attacksUsed:0,forcedReplacementPending:false}))return;if(!supportHand.some(x=>x===s||x?.id===s.id))return;const result=resolveSupport({supportId:s.id,active,used});if(!result.ok)return;dispatchBattle({type:"USE_SUPPORT",support:s.id});'''
          if old not in text:
              raise SystemExit("Support ordering anchor not found.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Validate
        run: |
          npm install
          npm run test:battle
          npm run test:engine
          npm run test:rng
          npm run test:support
          npm run test:character
          npm run build
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App07.jsx
          if git diff --cached --quiet; then
            echo "No migration changes detected."
            exit 0
          fi
          git commit -m "fix: resolve support before consuming card"
          git push
