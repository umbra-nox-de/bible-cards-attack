name: Patch Collection Rarity Layout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collection-rarity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collection layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App07.jsx')
          s=p.read_text()
          old='<div className="grid2">{[...starter,\'Solomon\',\'Peter\',\'Paul\',\'Samson\',...mythic].map(id=>unlocked.includes(id)||!mythic.includes(id)?<Card key={id} id={id} onClick={()=>setDetail(id)}/>:<div className="locked">🔒<b>{C[id].name}</b><small>Code required</small></div>)}</div>'
          new='''<div className="collectionRarityGroups">{[\'Common\',\'Uncommon\',\'Rare\',\'Epic\',\'Legendary\',\'Mythic\'].map(r=>{const ids=[...starter,\'Solomon\',\'Peter\',\'Paul\',\'Samson\',...mythic].filter((id,i,a)=>a.indexOf(id)===i&&C[id]&&C[id].rarity===r);return ids.length?<section className="collectionRarity" key={r}><h3>◆ {r}</h3><div className="collectionGrid3">{ids.map(id=>unlocked.includes(id)||!mythic.includes(id)?<Card key={id} id={id} onClick={()=>setDetail(id)}/>:<div className="locked" key={id}>🔒<b>{C[id].name}</b><small>Code required</small></div>)}</div></section>:null})}</div>'''
          if old not in s:
            raise SystemExit('Collection grid block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/styles.css')
          s=p.read_text()
          css='''\n.collectionRarityGroups{display:flex;flex-direction:column;gap:28px;margin-top:24px}.collectionRarity{width:100%}.collectionRarity h3{text-align:left;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #604b32;color:#e6c56f}.collectionGrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}.collectionGrid3 .card,.collectionGrid3 .locked{width:100%;min-width:0;margin:0}.collectionGrid3 .locked{min-height:150px;display:grid;place-items:center;align-content:center;gap:8px}@media(max-width:800px){.collectionGrid3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.collectionGrid3{grid-template-columns:1fr}}\n'''
          if '.collectionRarityGroups{' not in s:
            p.write_text(s+css)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App07.jsx src/styles.css
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'Organize collection cards by rarity in rows of three'
          git push
      - name: Remove patch workflow
        if: always()
        run: |
          git rm .github/workflows/collection-rarity.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Remove temporary collection patch workflow'
          git push || true
