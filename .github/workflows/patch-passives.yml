name: Patch Character Passives
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-passives.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch passives
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App07.jsx')
          s=p.read_text()
          s=s.replace('passive:"Stand Firm — once per battle, reduce a hit by 20."','passive:"Stand Firm — takes 15% less damage while in play."')
          s=s.replace('passive:"Letters of Encouragement — first Support each battle heals 10 HP."','passive:"Letters of Encouragement — healing Supports restore Paul for 5% extra healing."')
          s=s.replace('passive:"God-Given Strength — first attack each battle deals +15."','passive:"God-Given Strength — deals 10% more damage."')
          old="""if(active==='Peter'&&!used.peter){dmg=Math.max(0,dmg-20);setUsed(u=>({...u,peter:true}));addLog('🪨 Stand Firm: this hit is reduced by 20.')}"""
          new="""if(active==='Peter'){dmg=Math.floor(dmg*0.85);addLog('🪨 Stand Firm: Peter takes 15% less damage.')}"""
          if old not in s: raise SystemExit('Peter combat block not found')
          s=s.replace(old,new)
          old="""if(s.id==='loaves'){setHp(h=>({...h,[active]:Math.min(C[active].hp,h[active]+20)}));msg='🍞 Healed 20 HP.'}"""
          new="""if(s.id==='loaves'){const heal=20;setHp(h=>{const next={...h,[active]:Math.min(C[active].hp,h[active]+heal)};if(active==='Paul')next.Paul=Math.min(C.Paul.hp,(next.Paul??0)+Math.ceil(heal*0.05));return next});msg='🍞 Healed 20 HP.'+(active==='Paul'?' ✉️ Paul receives 5% extra healing.':'')}"""
          if old not in s: raise SystemExit('Loaves block not found')
          s=s.replace(old,new)
          old="""if(s.id==='manna'){setHp(h=>({...h,[active]:Math.min(C[active].hp,h[active]+10)}));setPrayers(p=>Math.min(10,p+1));msg='🌤️ Healed 10 and gained 1 Prayer.'}"""
          new="""if(s.id==='manna'){const heal=10;setHp(h=>{const next={...h,[active]:Math.min(C[active].hp,h[active]+heal)};if(active==='Paul')next.Paul=Math.min(C.Paul.hp,(next.Paul??0)+Math.ceil(heal*0.05));return next});setPrayers(p=>Math.min(10,p+1));msg='🌤️ Healed 10 and gained 1 Prayer.'+(active==='Paul'?' ✉️ Paul receives 5% extra healing.':'')}"""
          if old not in s: raise SystemExit('Manna block not found')
          s=s.replace(old,new)
          old="""if(active==='Paul'&&!used.paul){setHp(h=>({...h,[active]:Math.min(C[active].hp,h[active]+10)}));setUsed(u=>({...u,paul:true}));msg+=' ✉️ Encouragement: +10 HP.'}"""
          new="""if(active==='Paul'&&!used.paul){setUsed(u=>({...u,paul:true}));msg+=' ✉️ Encouragement passive active: healing Supports grant Paul 5% extra healing.'}"""
          if old not in s: raise SystemExit('Paul old bonus block not found')
          s=s.replace(old,new)
          old="""let bonus=nextAttackBonus;if(active==='Gideon'&&!used.gideon){bonus+=10;setUsed(u=>({...u,gideon:true}))}if(active==='Samson'&&!used.samson){bonus+=15;setUsed(u=>({...u,samson:true}))}let crit=Math.random()<(active==='David'?.25:.12);let total=dmg+bonus;if(crit)total=Math.round(total*1.5);"""
          new="""let bonus=nextAttackBonus;if(active==='Gideon'&&!used.gideon){bonus+=10;setUsed(u=>({...u,gideon:true}))}let crit=Math.random()<(active==='David'?.25:.12);let total=dmg+bonus;if(active==='Samson')total=Math.round(total*1.10);if(crit)total=Math.round(total*1.5);"""
          if old not in s: raise SystemExit('Samson attack block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Remove patch workflow
        run: rm .github/workflows/patch-passives.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App07.jsx .github/workflows/patch-passives.yml
          git commit -m 'Update Peter Paul and Samson passives'
          git push
